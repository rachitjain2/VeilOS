<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring / Boundary -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1e293b" stroke-width="6" stroke-dasharray="16 8"/>

  <!-- Shield Shape -->
  <path d="M 256,90 L 370,145 C 370,265 256,375 256,410 C 256,375 142,265 142,145 Z" 
        fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="12" filter="url(#glow)"/>

  <!-- Disposable Veil V Glyphs -->
  <path d="M 200,195 L 256,310 L 312,195" 
        fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner Spark: Volatile session -->
  <circle cx="256" cy="220" r="10" fill="#a855f7"/>
</svg>