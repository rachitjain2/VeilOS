name: Build VEILOS Live ISO

on:
  push:
    branches: [ veilos-main, main ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout VEILOS Repository
        uses: actions/checkout@v4

      - name: Install ISO Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            dosfstools \
            isolinux \
            syslinux-common \
            syslinux-utils \
            syslinux \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            rsync \
            librsvg2-bin
          echo "Patching host live-build to support Debian Bookworm repository format..."
          sudo find /usr/lib/live/ /usr/share/live/ -type f -exec sed -i 's|/updates|-security|g' {} + 2>/dev/null || true
          sudo find /usr/lib/live/ /usr/share/live/ -type f -exec sed -i 's|/dists/\([^/]*\)/Contents-|/dists/\1/main/Contents-|g' {} + 2>/dev/null || true
          sudo mkdir -p /usr/lib/syslinux /usr/lib/ISOLINUX /usr/lib/syslinux/modules/bios
          sudo cp -rn /usr/lib/ISOLINUX/* /usr/lib/syslinux/ 2>/dev/null || true
          sudo cp -rn /usr/lib/syslinux/* /usr/lib/ISOLINUX/ 2>/dev/null || true
          sudo cp -rn /usr/lib/syslinux/modules/bios/* /usr/lib/ISOLINUX/ 2>/dev/null || true
          sudo cp -f config/includes.chroot/usr/local/bin/rsvg /usr/local/bin/rsvg 2>/dev/null || true
          sudo cp -f config/includes.chroot/usr/local/bin/rsvg /usr/bin/rsvg 2>/dev/null || true
          sudo chmod +x /usr/local/bin/rsvg /usr/bin/rsvg 2>/dev/null || true
          echo "Executing VEILOS live-build environment patcher..."
          sudo python3 build/patch_live_build.py

      - name: Run VEILOS ISO Builder
        run: |
          sudo chmod +x build/*.sh build/*.py
          sudo chmod +x config/auto/*
          sudo chmod +x config/hooks/live/*
          sudo chmod +x config/includes.chroot/usr/local/bin/*
          sudo ./build/build.sh

      - name: Show Build Log on Failure
        if: failure()
        run: |
          if [ -f output/build.log ]; then
            echo "========== RECENT BUILD LOG OUTPUT =========="
            tail -n 150 output/build.log
          fi

      - name: Upload VEILOS ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: veilos-live-amd64
          path: |
            output/veilos-live-amd64.iso
            output/veilos-live-amd64.iso.sha256
          retention-days: 14
